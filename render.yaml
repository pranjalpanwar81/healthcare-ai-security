services:
  - type: web
    name: healthguard
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: MASTER_KEY
        sync: false
      - key: HOSPITAL_ENROLL_CODE
        sync: false
      - key: DOCTOR_REGISTRATION_CODE
        sync: false
      - key: HOSPITAL_TIMEZONE
        value: Asia/Kolkata
